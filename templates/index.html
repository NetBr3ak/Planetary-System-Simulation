<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planetary System Simulation</title>
    <meta name="description"
        content="Two-body gravity simulator. Enter the mass, position and velocity of two planets and plot the path each one follows.">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='2' fill='%2308090B'/><ellipse cx='16' cy='16' rx='13' ry='6' fill='none' stroke='%23FFB020' stroke-width='2' transform='rotate(-28 16 16)'/><circle cx='16' cy='16' r='4.5' fill='%235BE1FF'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- media="print" holds the third-party stylesheet off the critical path, the onload
         promotes it the moment it lands, and the noscript copy covers the rest. -->
    <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Fira+Code:wght@400..600&display=swap">
    <noscript>
        <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Fira+Code:wght@400..600&display=swap">
    </noscript>
    <!-- The basic bundle carries bar, pie and scatter. This page draws scatter only, so
         the full build costs 1,098,844 gzipped bytes (74.9%) it never executes. -->
    <script src="https://cdn.plot.ly/plotly-basic-3.3.0.min.js"
        integrity="sha384-bCeEXWVqVBEXg+2rAoWjwvt6o1BxDTM7IRdb+NinkxRNx612ir87vfMvcoNe3ZHl" crossorigin="anonymous"
        defer></script>
    <link rel="stylesheet" type="text/css" href="/static/styles.css">
    <script src="/static/scripts.js" defer></script>
</head>

<body>
    <main>
        <aside class="rail">
            <div class="plate">
                <p class="plate__spec reveal reveal--a">Two-body / dimensionless / DOP853 solve_ivp</p>
                <h1 class="reveal reveal--b">Planetary System Simulation</h1>
                <ul class="plate__constants reveal reveal--b">
                    <li>G = 1</li>
                    <li>t 0 to 10</li>
                    <li>1000 steps</li>
                    <li>rtol 1e-10</li>
                </ul>
            </div>

            <form id="simulationForm">
                <fieldset class="channel channel--1 reveal reveal--c">
                    <legend data-id="CH-1">Planet 1</legend>

                    <div class="field">
                        <label for="m1">Mass</label>
                        <input type="number" id="m1" name="m1" step="any" min="0.1" value="10000" required>
                    </div>
                    <div class="field">
                        <label for="r1">Position</label>
                        <span class="field__unit" aria-hidden="true">x, y</span>
                        <input type="text" id="r1" name="r1" inputmode="decimal"
                            pattern="\s*-?\d*\.?\d+([eE][+\-]?\d+)?\s*,\s*-?\d*\.?\d+([eE][+\-]?\d+)?\s*"
                            title="Two numbers separated by a comma, for example 0,0" placeholder="0,0" value="0,0"
                            required>
                    </div>
                    <div class="field">
                        <label for="v1">Velocity</label>
                        <span class="field__unit" aria-hidden="true">vx, vy</span>
                        <input type="text" id="v1" name="v1" inputmode="decimal"
                            pattern="\s*-?\d*\.?\d+([eE][+\-]?\d+)?\s*,\s*-?\d*\.?\d+([eE][+\-]?\d+)?\s*"
                            title="Two numbers separated by a comma, for example 5,3" placeholder="5,3" value="5,3"
                            required>
                    </div>
                </fieldset>

                <fieldset class="channel channel--2 reveal reveal--d">
                    <legend data-id="CH-2">Planet 2</legend>

                    <div class="field">
                        <label for="m2">Mass</label>
                        <input type="number" id="m2" name="m2" step="any" min="0.1" value="1500" required>
                    </div>
                    <div class="field">
                        <label for="r2">Position</label>
                        <span class="field__unit" aria-hidden="true">x, y</span>
                        <input type="text" id="r2" name="r2" inputmode="decimal"
                            pattern="\s*-?\d*\.?\d+([eE][+\-]?\d+)?\s*,\s*-?\d*\.?\d+([eE][+\-]?\d+)?\s*"
                            title="Two numbers separated by a comma, for example 4,4" placeholder="4,4" value="4,4"
                            required>
                    </div>
                    <div class="field">
                        <label for="v2">Velocity</label>
                        <span class="field__unit" aria-hidden="true">vx, vy</span>
                        <input type="text" id="v2" name="v2" inputmode="decimal"
                            pattern="\s*-?\d*\.?\d+([eE][+\-]?\d+)?\s*,\s*-?\d*\.?\d+([eE][+\-]?\d+)?\s*"
                            title="Two numbers separated by a comma, for example 45,-15" placeholder="45,-15"
                            value="45,-15" required>
                    </div>
                </fieldset>

                <button type="submit" class="run reveal reveal--e" id="run">
                    <span class="run__verb" id="runVerb">Run</span>
                    <span class="run__spec">solve_ivp / DOP853 / rtol 1e-10</span>
                </button>
            </form>
        </aside>

        <section class="bay" aria-label="Trajectory output">
            <div class="band reveal reveal--band">
                <div class="band__cell">
                    <span class="band__label">Separation <var>|r2-r1|</var></span>
                    <span class="band__value" id="outSeparation">---</span>
                </div>
                <div class="band__cell">
                    <span class="band__label">Time <var>t</var></span>
                    <span class="band__value" id="outTime">---</span>
                </div>
                <div class="band__cell">
                    <span class="band__label">Step</span>
                    <span class="band__value" id="outStep">---</span>
                </div>
                <div class="band__cell">
                    <span class="band__label">Energy drift <var>dE/E</var></span>
                    <span class="band__value" id="outDrift">---</span>
                </div>
                <div class="band__progress" id="progress" aria-hidden="true"></div>
            </div>

            <div class="scope">
                <div class="scope__graticule reveal reveal--f" aria-hidden="true"></div>
                <div id="plot"></div>
            </div>

            <div class="strip">
                <span class="led" id="led" aria-hidden="true"></span>
                <div class="seg" id="frames" role="group" aria-label="Reference frame" hidden>
                    <button type="button" data-frame="bary" aria-pressed="true">Barycentre</button>
                    <button type="button" data-frame="lab" aria-pressed="false">Lab</button>
                    <button type="button" data-frame="planet1" aria-pressed="false">Planet 1</button>
                </div>
                <button type="button" id="animate" aria-label="Play the live simulation" hidden>
                    <svg viewBox="0 0 12 14" width="11" height="13" aria-hidden="true" focusable="false">
                        <path class="icon-play" d="M1 1 L11 7 L1 13 Z" fill="currentColor" />
                        <rect class="icon-stop" x="1" y="2" width="10" height="10" fill="currentColor" />
                    </svg>
                    <span id="playVerb">Play</span>
                </button>
                <p id="status" role="status" aria-live="polite">Enter the two planets, then press Run.</p>
            </div>
        </section>
    </main>
</body>

</html>
