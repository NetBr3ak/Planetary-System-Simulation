<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planetary System Simulation</title>
    <meta name="description"
        content="Two-body gravity simulator. Enter the mass, position and velocity of two planets and plot the path each one follows.">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230c0f1c'/><ellipse cx='16' cy='16' rx='13' ry='6' fill='none' stroke='%23ff6699' stroke-width='2' transform='rotate(-28 16 16)'/><circle cx='16' cy='16' r='4.5' fill='%2366ff66'/></svg>">
    <script src="https://cdn.plot.ly/plotly-3.3.0.min.js"
        integrity="sha384-9j4dOnaStvA18a0L9YXraOfBpiADen+WXfxp1U03QguLoXMW9b5bKHada4AwQAxK" crossorigin="anonymous"
        defer></script>
    <link rel="stylesheet" type="text/css" href="/static/styles.css">
    <script src="/static/scripts.js" defer></script>
</head>

<body>
    <main>
        <h1>Planetary System Simulation</h1>
        <p class="lede">Two planets pull on each other with gravity. Units are dimensionless and G = 1. Every run
            integrates time from 0 to 10.</p>

        <form id="simulationForm">
            <fieldset>
                <legend>Planet 1</legend>
                <label for="m1">Mass</label>
                <input type="number" id="m1" name="m1" step="0.1" min="0.1" value="10000" required>
                <label for="r1">Position (x, y)</label>
                <input type="text" id="r1" name="r1" inputmode="decimal"
                    pattern="\s*-?\d*\.?\d+([eE][+\-]?\d+)?\s*,\s*-?\d*\.?\d+([eE][+\-]?\d+)?\s*"
                    title="Two numbers separated by a comma, for example 0,0" placeholder="0,0" value="0,0" required>
                <label for="v1">Velocity (vx, vy)</label>
                <input type="text" id="v1" name="v1" inputmode="decimal"
                    pattern="\s*-?\d*\.?\d+([eE][+\-]?\d+)?\s*,\s*-?\d*\.?\d+([eE][+\-]?\d+)?\s*"
                    title="Two numbers separated by a comma, for example 5,3" placeholder="5,3" value="5,3" required>
            </fieldset>

            <fieldset>
                <legend>Planet 2</legend>
                <label for="m2">Mass</label>
                <input type="number" id="m2" name="m2" step="0.1" min="0.1" value="1500" required>
                <label for="r2">Position (x, y)</label>
                <input type="text" id="r2" name="r2" inputmode="decimal"
                    pattern="\s*-?\d*\.?\d+([eE][+\-]?\d+)?\s*,\s*-?\d*\.?\d+([eE][+\-]?\d+)?\s*"
                    title="Two numbers separated by a comma, for example 4,4" placeholder="4,4" value="4,4" required>
                <label for="v2">Velocity (vx, vy)</label>
                <input type="text" id="v2" name="v2" inputmode="decimal"
                    pattern="\s*-?\d*\.?\d+([eE][+\-]?\d+)?\s*,\s*-?\d*\.?\d+([eE][+\-]?\d+)?\s*"
                    title="Two numbers separated by a comma, for example 45,-15" placeholder="45,-15" value="45,-15"
                    required>
            </fieldset>

            <button type="submit">Predict Trajectory</button>
        </form>

        <p id="status" role="status" aria-live="polite"></p>
        <button type="button" id="animate" hidden>Show Live Simulation</button>
        <div id="plot"></div>
    </main>
</body>

</html>
