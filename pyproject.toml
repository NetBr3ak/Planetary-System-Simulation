[project]
name = "planetary-system-simulation"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "flask>=3.1.3",
    "numpy>=2.5.1",
    "scipy>=1.18.0",
]

[tool.ruff]
target-version = "py39"

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true
