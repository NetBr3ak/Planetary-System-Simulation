[project]
name = "planetary-system-simulation"
version = "0.1.0"
# numpy 2.5 and scipy 1.18 both floor at 3.12, so ">=3.9" was never satisfiable.
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "numpy>=2.5.1",
    "scipy>=1.18.0",
]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true
